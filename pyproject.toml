[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-mcp"
version = "1.0.0"
description = "Fineas.ai — SEC financial intelligence platform. MCP server for SEC filing analysis with industry-aware XBRL extraction, market data integration, and AI-powered insights"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # Direct SEC EDGAR HTTP client
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Per-filing dimensional XBRL (segments) + calc-tree graphs — lazy-imported
    # by graph/, but load-bearing in prod: without it segments silently degrade
    "edgartools>=5.16",
    # Data processing
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Web server
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # MongoDB persistence
    "pymongo[srv]>=4.6",
    # Claude API for narrative explanations
    "anthropic>=0.40",
    # Market data provider
    "yfinance>=0.2.30",
    # Env file loading
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Supabase cache. Optional for the app (supabase_cache.py no-ops without it),
# REQUIRED for the batch sweep: batch_cache exits 1 when the cache is unavailable.
# The Dockerfile pins it separately; .github/workflows/cache-warm.yml installs it.
cache = [
    "supabase>=2.0",
]
# Stripe checkout + webhook. Optional: commerce/billing.py imports it lazily and
# every billing endpoint returns a clean 503 when it is absent.
billing = [
    "stripe>=9.0",
]
# MCP protocol server — only needed for Claude Desktop integration, not web dashboard
mcp = [
    "fastmcp>=2.0",
]
# Market data providers — optional alternative sources
market = [
    "yfinance>=0.2.30",
]
# NLP models — heavy (~2.5GB), only needed for local use
nlp = [
    "transformers>=4.40",
    "torch>=2.0",
    "sentencepiece",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires network access to SEC EDGAR",
    "slow: involves model loading",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom REQUIRES calls in parameter defaults
# (`x: T = Depends(...)`, `q: str = Query(...)`). B008 exists to catch mutable
# defaults, which these are not — without this every route is a false positive.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Form", "fastapi.File", "fastapi.Cookie",
    "fastapi.Security",
]
