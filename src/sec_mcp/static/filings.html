<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="/static/auth-gate.css?v=1">
<script src="/static/auth-gate.js?v=1"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fineas filing reader</title></head>
<body><p>Opening the <a id="reader-link" href="/?view=filings">Fineas filing reader</a>…</p>
<script>
const query = new URLSearchParams(location.search);
query.set('view','filings');
const segments = location.pathname.split('/').filter(Boolean);
if (segments[0] === 'filings' && /^[A-Za-z0-9][A-Za-z0-9.-]{0,11}$/.test(segments[1] || '')) query.set('ticker',segments[1].toUpperCase());
const target = '/?' + query;
document.getElementById('reader-link').href = target;
location.replace(target);
</script></body></html>
