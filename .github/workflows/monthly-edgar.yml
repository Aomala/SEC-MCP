name: Monthly SEC EDGAR ingestion

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monthly-edgar.yml']
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: Completed filing month (YYYY-MM), defaults to the previous month
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: monthly-edgar
  cancel-in-progress: false

env:
  EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check ingestion credentials
        shell: bash
        run: |
          missing=0
          for key in EDGAR_IDENTITY SUPABASE_URL SUPABASE_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing repository secret $key"
              missing=1
            fi
          done
          exit "$missing"

  index:
    needs: configuration
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . 'supabase>=2,<3'
      - name: Index filings
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [[ -n "$MONTH" ]]; then
            python -m sec_mcp.ingest_monthly --month "$MONTH"
          else
            python -m sec_mcp.ingest_monthly
          fi
      - name: Refresh the company directory and filing flags
        run: |
          python -m sec_mcp.ingest_all --phase 1
          python -m sec_mcp.ingest_all --phase 2

  financials:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . 'supabase>=2,<3'
      - run: python -m sec_mcp.ingest_all --phase 3
